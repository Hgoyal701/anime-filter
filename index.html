<!DOCTYPE html>
<html>
<head>
    <title>Anime Name Filter</title>

    <style>
        body {
            font-family: Arial;
            background-color: #1a1a2e;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff4da6;
        }

        input {
            width: 80%;
            max-width: 500px;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
        }

        .anime {
            background-color: #252545;
            padding: 15px;
            margin: 10px auto;
            max-width: 500px;
            border-radius: 10px;
        }

        .anime:hover {
            background-color: #33335c;
        }
    </style>
</head>

<body>

    <h1>🎌 Anime Name Filter</h1>

    <p>Type an anime name below:</p>

    <input
        type="text"
        id="search"
        placeholder="Search anime..."
        onkeyup="searchAnime()"
    >

    <div id="animeList">

        <div class="anime">Naruto</div>
        <div class="anime">One Piece</div>
        <div class="anime">Bleach</div>
        <div class="anime">Demon Slayer</div>
        <div class="anime">Jujutsu Kaisen</div>
        <div class="anime">Attack on Titan</div>
        <div class="anime">Death Note</div>
        <div class="anime">Dragon Ball</div>
        <div class="anime">My Hero Academia</div>
        <div class="anime">Haikyuu</div>

    </div>

    <script>

        function searchAnime() {

            let input = document.getElementById("search");

            let searchText = input.value.toLowerCase();

            let anime = document.getElementsByClassName("anime");

            for (let i = 0; i < anime.length; i++) {

                let name = anime[i].innerText.toLowerCase();

                if (name.includes(searchText)) {
                    anime[i].style.display = "block";
                } 
                else {
                    anime[i].style.display = "none";
                }
            }
        }

    </script>

</body>
</html>
